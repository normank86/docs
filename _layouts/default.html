<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    :root {
      --bg-start: #f7faf7;
      --bg-end: #dce8df;
      --surface: #ffffff;
      --ink: #1f2933;
      --muted: #52606d;
      --line: #d6dee6;
      --brand: #1b7f5f;
      --brand-strong: #125b44;
      --accent: #f29f05;
      --shadow: 0 12px 36px rgba(18, 32, 46, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Avenir Next", "Avenir", "Segoe UI", sans-serif;
      color: var(--ink);
      line-height: 1.65;
      background:
        radial-gradient(circle at 10% 5%, rgba(27, 127, 95, 0.12), transparent 36%),
        radial-gradient(circle at 92% 8%, rgba(242, 159, 5, 0.2), transparent 26%),
        linear-gradient(160deg, var(--bg-start), var(--bg-end));
      min-height: 100vh;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 20px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 14px;
      z-index: 5;
      backdrop-filter: blur(4px);
      animation: float-in 0.45s ease-out;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand strong {
      display: block;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
    }

    .brand span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    nav a {
      text-decoration: none;
      color: var(--brand-strong);
      border: 1px solid rgba(27, 127, 95, 0.25);
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    nav a:hover {
      transform: translateY(-1px);
      background: rgba(27, 127, 95, 0.1);
    }

    main {
      margin-top: 22px;
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 30px 22px;
      animation: rise-in 0.5s ease-out;
    }

    h1, h2, h3 {
      color: #17212b;
      line-height: 1.25;
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.8rem, 4vw, 2.45rem);
    }

    h2 {
      margin-top: 2rem;
      font-size: clamp(1.25rem, 2.6vw, 1.55rem);
      border-bottom: 2px solid #ebf1f5;
      padding-bottom: 6px;
    }

    p, li {
      color: var(--ink);
    }

    a {
      color: var(--brand-strong);
    }

    code {
      background: #f3f7fa;
      padding: 0 4px;
      border-radius: 4px;
    }

    blockquote {
      margin: 0;
      border-left: 4px solid var(--accent);
      padding: 8px 14px;
      background: #fff8ed;
      color: #5d450d;
      border-radius: 8px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 24px 0;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @keyframes float-in {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .shell {
        padding: 12px 12px 24px;
      }

      header {
        position: static;
      }

      main {
        padding: 22px 16px;
      }
    }
  </style>
</head>
<body>

<div class="shell">
  <header>
    <div class="brand">
      <div>
        <strong>{{ site.title }}</strong>
        <span>RefTracker and GridGrab for iOS</span>
      </div>
      <nav aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/#reftracker">RefTracker</a>
        <a href="/#gridgrab">GridGrab</a>
        <a href="/support/">Support</a>
        <a href="/privacy/">RefTracker Privacy</a>
        <a href="/gridgrab/privacy/">GridGrab Privacy</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    Contact: <a href="mailto:support@reftracker.app">support@reftracker.app</a>
  </footer>
</div>

</body>
</html>
